# Builds the Android APK in the cloud (no local Android SDK needed) and publishes it as a
# GitHub Release named "android-latest" so it can be downloaded directly on a phone.
name: android-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build web bundle
        run: node apps/web/build.mjs
      - name: Generate Android project (Capacitor)
        working-directory: apps/web
        run: |
          [ -d android ] || pnpm exec cap add android
          # the native QR scanner library requires Android 8.0+ (API 26)
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle
          grep -n minSdkVersion android/variables.gradle
          pnpm exec cap sync android
      - name: Build debug APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/texflow-debug.apk"
      - uses: actions/upload-artifact@v4
        with: { name: texflow-apk, path: texflow-debug.apk }
      - name: Publish release (android-latest)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest texflow-debug.apk --prerelease \
            --title "TEXFLOW Android (debug) ${GITHUB_SHA::7}" \
            --notes "Otomatik derlenen debug APK. Telefonda 'bilinmeyen kaynaklardan yükleme' izni gerekir. Uygulama açılınca TEXFLOW sunucu adresini girin."
