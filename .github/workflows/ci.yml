name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres_dev_only, POSTGRES_INITDB_ARGS: --auth=scram-sha-256 }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres_dev_only@127.0.0.1:5432/texflow
      APP_DATABASE_URL: postgres://texflow_app:app_dev_only@127.0.0.1:5432/texflow
      TEST_DATABASE_URL: postgres://postgres:postgres_dev_only@127.0.0.1:5432/texflow_test
      TEST_APP_DATABASE_URL: postgres://texflow_app:app_dev_only@127.0.0.1:5432/texflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: e2e/screenshots }
  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t texflow:${{ github.sha }} .
