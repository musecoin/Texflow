# Local / single-host deployment. Secrets come from .env (never commit it).
#   docker compose up -d postgres
#   docker compose run --rm migrate && docker compose run --rm seed   # seed = DEMO data, dev only
#   docker compose up -d api
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: texflow
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }

  migrate:
    build: .
    command: ["node", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD:-postgres_dev_only}@postgres:5432/texflow
      APP_DATABASE_URL: postgres://texflow_app:${APP_DB_PASSWORD:-app_dev_only}@postgres:5432/texflow
    depends_on: { postgres: { condition: service_healthy } }
    profiles: ["tools"]

  seed:
    build: .
    command: ["node", "packages/db/src/seed.ts"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD:-postgres_dev_only}@postgres:5432/texflow
      APP_DATABASE_URL: postgres://texflow_app:${APP_DB_PASSWORD:-app_dev_only}@postgres:5432/texflow
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo!2026}
    depends_on: { postgres: { condition: service_healthy } }
    profiles: ["tools"]

  api:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_DATABASE_URL: postgres://texflow_app:${APP_DB_PASSWORD:-app_dev_only}@postgres:5432/texflow
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,capacitor://localhost}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  # Phase 4+ (jobs, object storage) — not used by Phase 0 code
  redis:
    image: redis:7-alpine
    profiles: ["phase4"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${S3_ACCESS_KEY:-minio}", MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-minio_dev_only}" }
    profiles: ["phase4"]

volumes:
  pgdata:
